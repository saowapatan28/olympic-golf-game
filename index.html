<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Olympic Golf Game</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        html {
            font-size: 23px !important;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container { max-width: 100%; padding: 0 10px; }
        .main-card {
            background: white;
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            padding: 36px 26px;
        }

        h1 { font-size: 2.1rem !important; font-weight: 800; margin-bottom: 10px; }
        .subtitle { font-size: 1.15rem !important; color: #555; }
        .form-label { font-size: 1.35rem !important; font-weight: 700; margin-bottom: 14px; }

        .form-control {
            font-size: 1.5rem !important;
            padding: 22px 20px !important;
            min-height: 76px !important;
            border-radius: 18px !important;
            border: 3px solid #ccc !important;
            font-weight: 600;
        }

        .btn {
            font-size: 1.5rem !important;
            min-height: 76px !important;
            border-radius: 18px !important;
            font-weight: 700;
            padding: 22px 28px !important;
        }

        .btn-primary, .btn-success { width: 100%; }

        .table {
            width: 100%;
            table-layout: fixed;
            margin-top: 24px;
            font-size: 1.25rem !important;
        }

        .table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 12px !important;
            font-weight: 700;
            font-size: 1.3rem !important;
        }

        .player-number {
            width: 62px; height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.5rem !important;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .table th:nth-child(1), .table td:nth-child(1) { width: 76px; }
            .table th:nth-child(2), .table td:nth-child(2) { width: 43%; }
            .table th:nth-child(3), .table td:nth-child(3) { width: 140px; }
            .table th:nth-child(4), .table td:nth-child(4) { width: auto; }

            .table .form-control {
                min-height: 78px !important;
                border-radius: 16px !important;
                font-size: 1.55rem !important;
                font-weight: 700 !important;
                padding: 22px 18px !important;
                text-align: center;
            }

            .table td:nth-child(2) .form-control {
                text-align: left;
                padding-left: 26px !important;
            }
        }

        .result-text {
            text-align: center;
            vertical-align: middle;
            font-size: 1.9rem !important;
            font-weight: 900 !important;
            color: #000000;
        }

        .result-text.result-negative {
            color: #dc3545 !important;
            text-align: center;
            vertical-align: middle;
            font-size: 1.9rem !important;
            font-weight: 900 !important;
        }

        @media (max-width: 380px) {
            html { font-size: 25px !important; }
            .table .form-control { min-height: 82px !important; }
        }

        .input-group-text { display: none !important; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="text-center mb-4">
                <span style="font-size: 68px;">⛳</span>
                <h1>Olympic Golf Game</h1>
                <p class="subtitle">Head-to-Head Score Calculator</p>
            </div>
            
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <label for="numPlayers" class="form-label">Number of Players</label>
                    <input type="number" class="form-control" id="numPlayers" min="2" max="10" value="6" required inputmode="numeric">
                    <small class="text-muted">Enter 2-10 players</small>
                </div>
                <div class="col-12 col-md-6">
                    <label for="multiplier" class="form-label">Score Multiplier</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="multiplier" min="1" value="10" required inputmode="numeric">
                        <span class="input-group-text">×</span>
                    </div>
                    <small class="text-muted">e.g., 10 per point</small>
                </div>
            </div>
            
            <div class="text-center mb-4">
                <button type="button" class="btn btn-primary" onclick="generateTable()">
                    Generate Table
                </button>
            </div>
            
            <div id="playersTable" class="d-none">
                <hr class="my-5">
                <h4 class="mb-4 text-center fw-bold">Enter Names and Scores</h4>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Score</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="playersTableBody"></tbody>
                    </table>
                </div>
                
                <div class="text-center mt-5">
                    <button type="button" class="btn btn-success" onclick="calculateResults()">
                        Calculate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function generateTable() {
            const num = parseInt(document.getElementById('numPlayers').value);
            const mul = parseFloat(document.getElementById('multiplier').value);
            if (num < 2 || num > 10) return alert('กรุณาใส่ 2-10 คน');
            if (mul <= 0) return alert('ตัวคูณต้องมากกว่า 0');

            const tbody = document.getElementById('playersTableBody');
            tbody.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-center"><span class="player-number">P${i}</span></td>
                        <td><input type="text" class="form-control" id="playerName${i}" placeholder="ชื่อผู้เล่น" required></td>
                        <td><input type="number" class="form-control" id="playerPoint${i}" placeholder="คะแนน" required inputmode="numeric"></td>
                        <td><div id="playerResult${i}" class="result-text">-</div></td>
                    </tr>`;
            }
            document.getElementById('playersTable').classList.remove('d-none');
            document.getElementById('playersTable').scrollIntoView({ behavior: 'smooth' });
        }

        function calculateResults() {
            const num = parseInt(document.getElementById('numPlayers').value);
            const mul = parseFloat(document.getElementById('multiplier').value);
            const players = [];

            // รับข้อมูลผู้เล่น
            for (let i = 1; i <= num; i++) {
                const name = document.getElementById(`playerName${i}`).value.trim();
                const point = parseInt(document.getElementById(`playerPoint${i}`).value);
                if (!name || isNaN(point)) return alert('กรุณากรอกให้ครบทุกช่อง');
                players.push({ name, point, index: i });
            }

            // คำนวณคะแนน Head-to-Head
            for (let i = 0; i < players.length; i++) {
                let diff = 0;
                
                // เปรียบเทียบกับผู้เล่นคนอื่นทั้งหมด
                for (let j = 0; j < players.length; j++) {
                    if (i !== j) {
                        diff += players[i].point - players[j].point;
                    }
                }
                
                const score = diff * mul;
                const div = document.getElementById(`playerResult${players[i].index}`);
                const text = score > 0 ? '+' + score.toLocaleString() : score.toLocaleString();
                
                div.innerHTML = text;
                
                // กำหนด class ตามเงื่อนไข
                if (score < 0) {
                    div.className = 'result-text result-negative';
                } else {
                    div.className = 'result-text';
                }
            }
        }
    </script>
</body>
</html>
